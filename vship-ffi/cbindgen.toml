# cbindgen configuration for generating vship.h

language = "C"
include_guard = "VSHIP_H"
pragma_once = true
autogen_warning = "/* Warning: This file is auto-generated by cbindgen. Do not modify. */"
header = """
/*
 * Vship - GPU-Accelerated Visual Fidelity Metrics Library
 * Version 4.1.0 (Rust/Vulkan Rewrite)
 *
 * Psychovisual image and video quality metrics:
 * - SSIMULACRA2: Cloudinary's perceptual image quality metric
 * - Butteraugli: Google's psychovisual image difference metric
 * - CVVDP: University of Cambridge's psychovisual video quality metric
 *
 * License: MIT OR Apache-2.0
 */
"""

[export]
include = ["VshipErrorCode", "VshipMetricType", "VshipImageFormat"]

[export.rename]
"VshipHandle" = "VshipHandle"
"VshipMetricHandle" = "VshipMetricHandle"

[enum]
rename_variants = "ScreamingSnakeCase"

[fn]
rename_args = "ScreamingSnakeCase"
